# Reto final — Componente "frontend", expuesto hacia fuera del cluster
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Sustituye por tu propia imagen de frontend construida en el bloque de Docker
          image: httpd:2.4
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: "http://backend-service"   # DNS interno: nombre del Service backend
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30090
