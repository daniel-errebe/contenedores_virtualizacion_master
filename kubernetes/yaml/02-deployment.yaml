# Lab 1b — El mismo contenedor, pero gestionado por un Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  labels:
    app: web-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-demo
  template:
    metadata:
      labels:
        app: web-demo
    spec:
      containers:
        - name: web
          # Sustituye por tu propia imagen del bloque de Docker
          image: nginx:1.25
          ports:
            - containerPort: 80
